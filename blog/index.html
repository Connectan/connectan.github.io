<!doctype html>
<html lang="ja" data-glass="liquid" data-wall="aurora" data-anim="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog | こねくたん</title>
<meta name="description" content="こねくたんのブログ。端末のこととか、作ったもののこととか。">
<meta name="site-base" content="/">
<link rel="alternate" type="application/atom+xml" title="こねくたん Blog" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="blog">

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow mono reveal">BLOG</div>
    <h2 class="reveal" style="font-size:clamp(36px,7vw,56px)" data-i18n="blog.h">ブログ</h2>
    <p class="lead reveal" data-i18n="blog.lead">端末のこととか、作ったもののこととか。</p>
  </div>
  <div class="tagbar reveal" id="tagbar"></div>
  <div class="featured" id="featured"></div>
  <div class="posts" id="list"></div>
</main>

<footer class="foot wrap"><div class="inner glass"></div></footer>

<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/common.js"></script>
<script>
(() => {
const U = window.UI, { $, esc } = U, T = U.T;
U.loadPosts().then(posts => {
  if (!posts.length) {
    $("list").innerHTML = `<div class="glass empty reveal" style="grid-column:1/-1">${T("blog.empty")}</div>`;
    U.reveal(); return;
  }
  const tags = [...new Set(posts.flatMap(p => p.tags || []))];
  let cur = "";
  function render() {
    const hit = posts.filter(p => !cur || (p.tags || []).includes(cur));
    const picks = cur ? [] : U.pickedPosts(hit).slice(0, 3);
    const rest = hit.filter(p => !picks.includes(p));
    $("featured").innerHTML = picks.map((p, i) => U.postCard(p, { big: true, d: i })).join("");
    $("list").innerHTML = rest.map((p, i) => U.postCard(p, { d: i % 6 })).join("");
    $("tagbar").innerHTML = ["", ...tags].map(t =>
      `<button class="glass" data-t="${esc(t)}" aria-pressed="${t === cur}">${t ? "#" + esc(t) : T("blog.all")}</button>`).join("");
    U.reveal();
  }
  $("tagbar").addEventListener("click", e => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    cur = b.dataset.t; render();
  });
  render();
});
})();
</script>
</body>
</html>
